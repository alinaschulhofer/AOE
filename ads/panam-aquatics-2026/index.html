<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AOE · PanAm Aquatics Ad Concepts</title>
<style>
  @font-face { font-family: 'Manrope'; src: url('assets/fonts/manrope-300.ttf'); font-weight: 300; }
  @font-face { font-family: 'Manrope'; src: url('assets/fonts/manrope-500.ttf'); font-weight: 500; }
  :root { --bg: #E6E0D3; --ink: #1C1B19; --ink2: #595650; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Manrope', sans-serif; font-weight: 300; padding: 40px 16px 80px; }
  header, .grid { max-width: 1400px; margin-inline: auto; }
  h1 { font-weight: 300; font-size: 28px; letter-spacing: -.01em; }
  header p { color: var(--ink2); margin-top: 8px; max-width: 720px; line-height: 1.6; }
  .toggle { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle button { font: inherit; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 9px 16px; border-radius: 99px; border: 1px solid var(--ink); background: none; color: var(--ink); cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .grid { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px; }
  figure { display: flex; flex-direction: column; gap: 12px; }
  .frame { width: 100%; aspect-ratio: var(--ratio, 148 / 210); overflow: hidden; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .frame iframe { border: 0; width: 100%; height: 100%; display: block; }
  figcaption b { font-weight: 500; }
  figcaption span { display: block; color: var(--ink2); font-size: 14px; margin-top: 4px; line-height: 1.5; }
  figcaption a { color: inherit; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Architecture of Excellence™ · PanAm Aquatics half-page</h1>
  <p>Concepts built on the live site's identity. The final editorial version (first) is the selected design; the concepts that led to it follow. Toggle the format below; each concept opens on its own for print preview, and PDFs are in <code>export/</code>.</p>
  <div class="toggle" role="group" aria-label="Format">
    <button data-format="v" aria-pressed="true">Portrait 148 × 210 mm</button>
    <button data-format="h" aria-pressed="false">Horizontal 210 × 148 mm</button>
  </div>
</header>

<section class="grid">
  <figure>
    <div class="frame"><iframe data-src="final-editorial.html" title="Final"></iframe></div>
    <figcaption><b>Final — Editorial</b> (selected)<span>Refinement of Concept 2: larger headline, two-part introduction, one compass motif on the right, and an editorial service index. Portrait and A4 only.</span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe data-src="concept-1-elevation.html" title="Concept 1"></iframe></div>
    <figcaption><b>Concept 1 — Elevation</b><span>Charcoal ground; three services with architectural line drawings in place of photography.</span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe data-src="concept-2-ripple.html" data-theme="dark" title="Concept 2"></iframe></div>
    <figcaption><b>Concept 2 — Ripple</b><span>Typography-led; concentric rings and the site's thin-circle numerals. Also available in ivory.</span></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe data-src="concept-3-foundation.html" title="Concept 3"></iframe></div>
    <figcaption><b>Concept 3 — Foundation</b><span>The headline set inside an architect's compass construction; services as a three-bay plan.</span></figcaption>
  </figure>
</section>

<script>
  // Each iframe loads the ad with ?embed=1, so it scales itself to fit the frame.
  var format = 'v';
  try { format = localStorage.getItem('aoe-ad-format') || 'v'; } catch (e) {}
  function render() {
    document.querySelectorAll('.toggle button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.format === format); });
    document.querySelectorAll('.frame').forEach(function (frame) {
      var f = frame.querySelector('iframe');
      frame.style.setProperty('--ratio', format === 'h' ? '210 / 148' : '148 / 210');
      var fmt = f.dataset.src.indexOf('final') === 0 ? 'v' : format;
      if (fmt !== format) frame.style.setProperty('--ratio', '148 / 210');
      f.src = f.dataset.src + '?embed=1&format=' + fmt + (f.dataset.theme ? '&theme=' + f.dataset.theme : '');
    });
  }
  document.querySelectorAll('.toggle button').forEach(function (b) {
    b.addEventListener('click', function () { format = b.dataset.format; try { localStorage.setItem('aoe-ad-format', format); } catch (e) {} render(); });
  });
  render();
</script>
</body>
</html>

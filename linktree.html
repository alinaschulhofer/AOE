<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Alina Schulhofer</title>
  <meta name="description" content="Licensed psychologist & executive coach. Founder of Architecture of Excellence™." />
  <meta name="robots" content="noindex" />

  <script>
    (function(){
      var d = localStorage.getItem('aoe-direction') || 'ivory';
      document.documentElement.setAttribute('data-theme', d);
    })();
  </script>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── TOKENS ── */
    :root {
      --bg:       #F3EFE6;
      --bg2:      #EDE8DD;
      --ink:      #1C1916;
      --ink2:     #5A5248;
      --ink3:     #8A8078;
      --accent:   #A8824E;
      --accent-2: #C9A97A;
      --rule:     rgba(28,25,22,.14);
      --card-bg:  rgba(255,255,255,.55);
      --card-border: rgba(28,25,22,.10);
      --ease:     cubic-bezier(.25,.46,.45,.94);
    }
    :root[data-theme="luxe"] {
      --bg:       #121110;
      --bg2:      #1A1917;
      --ink:      #EFE9DC;
      --ink2:     #B8B0A4;
      --ink3:     #7A7268;
      --rule:     rgba(239,233,220,.12);
      --card-bg:  rgba(255,255,255,.04);
      --card-border: rgba(239,233,220,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
    }

    a { color: inherit; text-decoration: none; }

    /* ── CONTAINER ── */
    .lt-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* ── AVATAR ── */
    .lt-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid var(--rule);
      flex-shrink: 0;
    }
    .lt-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    /* ── NAME / BIO ── */
    .lt-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .lt-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 400;
      letter-spacing: -.015em;
      line-height: 1.1;
    }

    .lt-bio {
      font-size: 0.875rem;
      color: var(--ink2);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* ── DIVIDER ── */
    .lt-rule {
      width: 40px;
      height: 1px;
      background: var(--accent);
      opacity: .6;
      border: none;
    }

    /* ── LINKS ── */
    .lt-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .lt-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1.1rem 1.4rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background .25s var(--ease), border-color .25s var(--ease), transform .2s var(--ease);
      cursor: pointer;
    }

    .lt-btn:hover {
      background: rgba(168,130,78,.08);
      border-color: rgba(168,130,78,.3);
      transform: translateY(-1px);
    }

    .lt-btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
      font-size: 1rem;
    }

    .lt-btn-text {
      flex: 1;
    }

    .lt-btn-label {
      font-size: 0.72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink3);
      display: block;
      margin-bottom: .15rem;
    }

    .lt-btn-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -.01em;
      line-height: 1.2;
    }

    .lt-btn-arrow {
      color: var(--accent);
      opacity: .7;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* ── FOOTER ── */
    .lt-footer {
      font-size: 0.72rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--ink3);
      text-align: center;
    }

    .lt-footer a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>

<main class="lt-wrap">

  <div class="lt-avatar">
    <img src="assets/portrait-about.jpg" alt="Dr. Alina Schulhofer" />
  </div>

  <div class="lt-header">
    <h1 class="lt-name">Dr. Alina Schulhofer</h1>
    <p class="lt-bio">Psychologist &amp; Executive Coach</p>
  </div>

  <hr class="lt-rule" />

  <nav class="lt-links" aria-label="Quick links">

    <a class="lt-btn" href="https://alinaschulhofer.github.io/AOE/index.html#contact">
      <div class="lt-btn-icon" aria-hidden="true">✦</div>
      <div class="lt-btn-text">
        <span class="lt-btn-label">Work together</span>
        <span class="lt-btn-title">Book a Consultation</span>
      </div>
      <span class="lt-btn-arrow" aria-hidden="true">→</span>
    </a>

    <a class="lt-btn" href="https://alinaschulhofer.github.io/AOE/insights.html">
      <div class="lt-btn-icon" aria-hidden="true">◈</div>
      <div class="lt-btn-text">
        <span class="lt-btn-label">Ideas &amp; writing</span>
        <span class="lt-btn-title">Read the Blog</span>
      </div>
      <span class="lt-btn-arrow" aria-hidden="true">→</span>
    </a>

    <a class="lt-btn" href="https://alinaschulhofer.github.io/AOE/fear-of-success.html">
      <div class="lt-btn-icon" aria-hidden="true">◇</div>
      <div class="lt-btn-text">
        <span class="lt-btn-label">Featured article</span>
        <span class="lt-btn-title">The Fear of Success</span>
      </div>
      <span class="lt-btn-arrow" aria-hidden="true">→</span>
    </a>

  </nav>

  <p class="lt-footer">
    <a href="https://alinaschulhofer.github.io/AOE/">alinaschulhofer.com</a>
  </p>

</main>

</body>
</html>
